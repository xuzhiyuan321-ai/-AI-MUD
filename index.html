<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>无限恐怖 · 蜂房</title>
<!-- N1 favicon：主神光球（金色圆环），内联 SVG，无需外部资源 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23e8c860' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23ffd966'/%3E%3C/svg%3E">
<style>
/* ============================================================
 * 《无限恐怖》H5 系列 · 全局样式
 * N1：仅 UI 外壳与空面板，不含地图/战斗/NPC 样式（后续阶段追加）
 * 视觉语言：继承江湖版暗色骨架，换生化冷青 + 主神金
 * ============================================================ */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; overflow:hidden; }
:root {
  --bg:#050707; --panel:#0b0f0e; --panel2:#101614; --panel3:#161d1a;
  --line:#26302c; --line2:#3a4640;
  --txt:#c8d6c8; --dim:#7d8a82; --dim2:#55605a;
  --cyan:#40c0c0; --gold:#e8c860; --god:#ffd966;
  --red:#e06060; --green:#6fbf6f; --blue:#76b8d6;
}
body {
  background:#000; color:var(--txt);
  font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
  font-size:14px; line-height:1.6; user-select:none; -webkit-user-select:none;
}
#game { display:flex; flex-direction:column; height:100%; width:100%; max-width:480px; margin:0 auto; background:var(--bg); }

/* ===== 标题屏 ===== */
#intro {
  position:fixed; inset:0; z-index:300; background:#000;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  max-width:480px; margin:0 auto; padding:40px 34px;
}
#intro .bio-svg { opacity:.55; margin-bottom:26px; animation:bioPulse 3.2s ease-in-out infinite; }
@keyframes bioPulse { 0%,100%{opacity:.32} 50%{opacity:.7} }
#intro .en-title { color:var(--dim2); font-size:11px; letter-spacing:6px; margin-bottom:10px; }
#intro .cn-title { color:#e6e8e2; font-size:40px; font-weight:bold; letter-spacing:10px; text-indent:10px; }
#intro .cn-sub { color:var(--gold); font-size:15px; letter-spacing:4px; margin-top:14px; }
#intro .cn-desc { color:var(--dim); font-size:12px; margin-top:26px; text-align:center; line-height:1.9; }
#intro .intro-btns { width:100%; max-width:260px; margin-top:46px; display:flex; flex-direction:column; gap:12px; }
#intro .intro-btns .here-btn { padding:13px; min-height:46px; }
#intro .ver-line { position:absolute; bottom:18px; color:#3a443f; font-size:10px; letter-spacing:1px; }

/* ===== 通用按钮 ===== */
.here-btn {
  background:var(--panel2); border:1px solid var(--line2); color:var(--txt);
  padding:9px 14px; border-radius:4px; font-size:13px; cursor:pointer;
  font-family:inherit; line-height:1.4;
}
.here-btn:active { background:var(--panel3); border-color:var(--gold); color:var(--gold); }
.here-btn.primary { background:var(--gold); border-color:var(--gold); color:#111; font-weight:bold; }
.here-btn.primary:active { background:#f0d878; }
.here-btn.danger { background:#2a1513; border-color:#6e3a34; color:var(--red); }
.here-btn.ghost { background:transparent; color:var(--dim); border-color:var(--line); }
.mbtn {
  background:var(--panel2); border:1px solid var(--line2); color:var(--txt);
  padding:6px 12px; border-radius:4px; font-size:13px; cursor:pointer; font-family:inherit;
}
.mbtn:active { border-color:var(--gold); color:var(--gold); }

/* ===== 顶部导航 ===== */
#topnav {
  flex-shrink:0; background:#0a0d0c; border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between; padding:9px 12px;
}
#topnav .tn-side { flex:0 0 64px; color:var(--cyan); font-size:13px; text-align:center; cursor:pointer; padding:8px 0; min-height:40px; }
#topnav .tn-side.right { color:var(--god); }
#topnav .tn-center { flex:1; text-align:center; }
#nav-loc { color:var(--gold); font-size:16px; font-weight:bold; letter-spacing:1px; }
#nav-watch { color:var(--red); font-size:11px; margin-top:1px; font-family:ui-monospace,Menlo,monospace; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#nav-watch .warn { color:#ff5a4d; font-weight:bold; animation:blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity:.35; } }

/* ===== 主区域 ===== */
#main-area { flex:1; overflow-y:auto; padding:14px; min-height:0; }
.scene-desc { color:var(--cyan); font-size:14px; line-height:1.85; white-space:pre-wrap; }
.scene-ph {
  margin-top:14px; border:1px dashed var(--line); border-radius:6px;
  padding:18px 12px; text-align:center; color:var(--dim2); font-size:12px; line-height:1.8;
}
#map-container, #here-section { margin-top:12px; }

/* ===== 豆包N3：3x3 方位行走图 ===== */
.map-grid { position:relative; margin-top:4px; }
.map-lines { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:0; }
.map-row { display:grid; grid-template-columns:1fr 1fr 1fr; position:relative; z-index:1; }
.map-cell { display:flex; align-items:center; justify-content:center; padding:5px; min-height:54px; }
.map-node {
  width:100%; min-height:42px; display:flex; align-items:center; justify-content:center; gap:3px;
  text-align:center; font-size:11px; line-height:1.25; color:var(--txt);
  background:var(--panel2); border:1px solid var(--line2); border-radius:6px;
  padding:4px 6px; cursor:pointer; word-break:break-all;
}
.map-node:active { border-color:var(--gold); color:var(--gold); }
.map-node.current {
  background:#17170f; border-color:var(--gold); color:var(--gold); font-weight:bold;
  cursor:default; box-shadow:0 0 12px rgba(232,200,96,.18);
}
.map-node.locked { border-style:dashed; border-color:#8a5a34; color:#c99b6c; }
.zone-tag { font-size:9px; color:var(--cyan); border:1px solid #2c5252; border-radius:3px; padding:0 3px; flex-shrink:0; }
.lock-tag { font-size:9px; color:#e0a878; border:1px solid #6e4a34; border-radius:3px; padding:0 3px; flex-shrink:0; }
/* 移动进场动画（按上次方向轻微滑入） */
.map-anim { animation:mapIn .16s ease-out; }
.map-anim-south { animation:mapInS .16s ease-out; }
.map-anim-west  { animation:mapInW .16s ease-out; }
.map-anim-east  { animation:mapInE .16s ease-out; }
@keyframes mapIn   { from { opacity:.25; } to { opacity:1; } }
@keyframes mapInS  { from { opacity:.25; transform:translateY(-8px);} to { opacity:1; transform:none; } }
@keyframes mapInW  { from { opacity:.25; transform:translateX(8px);} to { opacity:1; transform:none; } }
@keyframes mapInE  { from { opacity:.25; transform:translateX(-8px);} to { opacity:1; transform:none; } }

/* ===== 豆包N3：区域信息条 ===== */
.zone-bar {
  margin-top:14px; display:flex; align-items:center; justify-content:space-between;
  background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 13px;
}
.zb-name { color:var(--gold); font-size:14px; font-weight:bold; }
.zb-sub { display:block; color:var(--dim2); font-size:11px; margin-top:1px; }
.zb-map { flex-shrink:0; }

/* ===== 豆包N4：在场人物 ===== */
.people-sec { margin-top:12px; }
.people-title { font-size:12px; color:var(--dim); margin:0 2px 7px; letter-spacing:1px; }
.people-list { display:flex; flex-wrap:wrap; gap:9px; }
.person {
  display:flex; align-items:center; gap:8px; background:var(--panel);
  border:1px solid var(--line); border-left-width:3px; border-radius:8px;
  padding:7px 11px 7px 7px; cursor:pointer; transition:border-color .15s, background .15s;
}
.person:hover { background:var(--panel2); }
.p-ava {
  width:32px; height:32px; border-radius:7px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-size:15px; font-weight:bold; color:#060908; background:var(--gold);
}
.p-meta { line-height:1.25; }
.p-name { font-size:13px; color:var(--txt); font-weight:bold; }
.p-role { font-size:10px; color:var(--dim); }
/* 阵营：轮回者=金 / 剧情角色=冷青 / 红后AI=紫 */
.person.c-reincarn { border-left-color:var(--gold); }
.person.c-reincarn .p-ava { background:#d8b15a; }
.person.c-movie { border-left-color:var(--cyan); }
.person.c-movie .p-ava { background:#5fae9d; }
.person.c-ai { border-left-color:#a06ad0; }
.person.c-ai .p-ava { background:#b794e0; }
/* 豆包v168：剧情门控「问话目标」——金色脉冲描边 + 头像红点 + 名字后「问话」角标 */
.person.is-gate { border-color:var(--gold); background:#1c1a10; animation:gatePulse 1.5s ease-in-out infinite; }
.person.is-gate .p-ava { position:relative; }
.gate-dot { position:absolute; top:-5px; right:-5px; width:15px; height:15px; border-radius:50%;
  background:#c0564f; color:#fff; font-size:10px; line-height:15px; text-align:center; font-weight:bold; border:1px solid #1a0d0c; }
.gate-tag { display:inline-block; font-size:9px; font-weight:bold; color:#1a1407;
  background:linear-gradient(90deg,#e6c46a,#f4dd96); border-radius:3px; padding:1px 5px; margin-left:3px; }
@keyframes gatePulse {
  0%,100% { box-shadow:0 0 0 1px rgba(216,177,90,.45), 0 0 9px rgba(216,177,90,.16); }
  50%     { box-shadow:0 0 0 1px rgba(216,177,90,.9),  0 0 18px rgba(216,177,90,.42); }
}
@media (prefers-reduced-motion: reduce){ .person.is-gate { animation:none; } }

/* ===== 豆包N3：全屏区域小地图 ===== */
.minimap-head { color:var(--gold); font-size:16px; font-weight:bold; margin-bottom:10px; }
.minimap-head .mh-sub { color:var(--dim); font-size:12px; font-weight:normal; }
#wk-map-scroll {
  overflow:auto; max-height:48vh; background:#070a09; border:1px solid var(--line);
  border-radius:8px; padding:10px;
}
.minimap-grid { display:grid; width:max-content; min-width:100%; justify-content:center; position:relative; }
.minimap-lines { position:absolute; top:0; left:50%; transform:translateX(-50%); pointer-events:none; z-index:0; }
.mm-cell { display:flex; align-items:center; justify-content:center; position:relative; z-index:1; }
.mm-node {
  width:82px; min-height:40px; display:flex; align-items:center; justify-content:center; text-align:center;
  font-size:10px; line-height:1.2; border:1px solid var(--line2); background:#0c100e; color:var(--dim);
  border-radius:5px; padding:3px; cursor:pointer; word-break:break-all;
}
.mm-node.cur { border-color:var(--gold); color:var(--gold); font-weight:bold; background:#17170f; cursor:default; }
.mm-node.unknown { color:#46504a; border-style:dashed; background:#090c0b; cursor:default; }
.minimap-legend { font-size:11px; color:var(--dim); margin-top:11px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
.minimap-legend .lg { display:inline-block; width:11px; height:11px; border-radius:2px; margin-right:4px; vertical-align:-1px; }
.lg.cur { background:#17170f; border:1px solid var(--gold); }
.lg.seen { background:#0c100e; border:1px solid var(--line2); }
.lg.unk { background:#090c0b; border:1px dashed var(--line2); }
.lg.dash { width:18px; height:0; border-top:2px dashed #8a7a3a; }
/* 豆包N14：.minimap-zones / .zone-chip 跨区跳转芯片样式已随功能删除 */
.exit-label { color:var(--dim); font-size:12px; margin:10px 0 6px; }
.here-list { display:flex; flex-wrap:wrap; gap:7px; }

/* ===== 日志区（全局唯一，多页面通过 mountLog 复用——N1 只有一个挂载位） ===== */
#log-area {
  flex-shrink:0; height:150px; overflow-y:auto; background:#070908;
  border-top:1px solid var(--line); padding:8px 12px;
  font-size:12px; line-height:1.65;
}
#log-area .l { margin-bottom:2px; word-break:break-all; }
#log-area .sys    { color:var(--dim); }
#log-area .god    { color:var(--god); }
#log-area .npc    { color:var(--blue); }
#log-area .you    { color:var(--green); }
#log-area .dmg    { color:var(--red); }
#log-area .reward { color:var(--green); }
#log-area .danger { color:#ff5a4d; }
#log-area .quest  { color:var(--gold); }

/* ===== 底部操作栏 ===== */
#actionbar { flex-shrink:0; display:flex; background:#0a0d0c; border-top:1px solid var(--line); }
.abtn {
  flex:1; padding:12px 0; background:transparent; border:none; color:var(--dim);
  font-size:12px; cursor:pointer; font-family:inherit; border-right:1px solid #1a201d; min-height:44px;
}
.abtn:last-child { border-right:none; }
.abtn:active { color:var(--gold); background:#10140f; }

/* ===== 覆盖层 ===== */
.overlay {
  position:fixed; top:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:480px; height:100%; background:var(--bg);
  z-index:100; display:none; flex-direction:column;
}
.overlay.active { display:flex; }
.overlay.compact {
  top:50%; left:50%; transform:translate(-50%,-50%);
  width:92%; max-width:440px; height:auto; max-height:78vh;
  background:#080b0a; border:1px solid var(--line2); border-radius:12px;
  box-shadow:0 10px 34px rgba(0,0,0,.75); overflow:hidden;
}
/* 对话窗高于标题屏 intro(300)：起名/覆盖确认在标题阶段弹出 */
#ov-dialog { z-index:400; }
/* 豆包v166：通用面板也要高于标题屏 intro(300)——三档读档/新游戏选槽在标题阶段就用它，
   否则会被标题屏压在下面点不到。仍低于 ov-dialog(400) 以便二次确认弹层叠在其上。 */
#ov-generic { z-index:350; }
.overlay-header {
  flex-shrink:0; background:#101412; border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between; padding:8px 14px;
}
.oh-side { color:var(--cyan); font-size:15px; cursor:pointer; padding:4px 8px; }
.oh-side:active { color:var(--gold); }
.oh-center { color:var(--gold); font-size:16px; font-weight:bold; flex:1; text-align:center; padding:0 8px; }
.overlay-body { flex:1; overflow-y:auto; padding:15px 16px; min-height:0; }
.overlay.compact .overlay-body { padding:14px 16px 12px; }

/* ===== Tabs（人物面板） ===== */
.ov-tabs { flex-shrink:0; display:flex; background:#101412; border-bottom:1px solid var(--line); }
.ov-tab {
  flex:1; background:transparent; border:none; color:var(--dim);
  font-size:14px; padding:10px; cursor:pointer; font-family:inherit; border-right:1px solid #1a201d;
}
.ov-tab:last-child { border-right:none; }
.ov-tab.active { color:var(--gold); background:#141a17; border-bottom:2px solid var(--gold); }

/* ===== 人物 / 背包 / 技能内容 ===== */
.stat-row { font-size:14px; line-height:2.05; color:var(--txt); display:flex; justify-content:space-between; }
.stat-row .k { color:var(--dim); }
.stat-sec { color:var(--gold); font-size:12px; letter-spacing:2px; margin:14px 0 6px; padding-bottom:4px; border-bottom:1px solid var(--line); }
.stat-sec:first-child { margin-top:0; }
.attr-grid { display:grid; grid-template-columns:1fr 1fr; gap:4px 18px; }
.empty-tip { color:var(--dim2); font-size:13px; text-align:center; padding:34px 10px; line-height:2; }
.bag-item {
  display:flex; justify-content:space-between; align-items:center;
  background:var(--panel2); border:1px solid var(--line); border-radius:5px;
  padding:9px 12px; margin-bottom:7px; font-size:13px;
}
.bag-item .bi-count { color:var(--gold); font-size:12px; }

/* ===== 剧情 / NPC 对话 ===== */
.dlg-text { font-size:14px; line-height:1.95; color:#cdd6cf; white-space:pre-wrap; }
.dlg-text .who { color:var(--blue); }
.dlg-text .godline { color:var(--god); }
.dlg-text .danger { color:var(--red); }
.dlg-text .reward { color:var(--green); }
.dlg-text .sys { color:var(--dim); }
.dlg-actions { flex-shrink:0; padding:10px 14px 14px; background:#0a0d0c; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:8px; }
.dlg-actions .here-btn { width:100%; padding:12px; }
input[type=text] {
  width:100%; padding:11px; background:var(--panel2); border:1px solid var(--line2);
  color:#fff; border-radius:6px; font-size:16px; font-family:inherit; margin:6px 0 4px;
}
input[type=text]:focus { outline:none; border-color:var(--gold); }

/* ===== 豆包N2：记忆闪回卡片 ===== */
#ov-foreshow { background:rgba(2,4,3,.97); z-index:380; }
.fs-card {
  width:100%; max-width:400px;
  background:linear-gradient(180deg,#12140c,#0a0c08);
  border:1px solid #6a5e2a; border-radius:10px;
  box-shadow:0 0 40px rgba(232,200,96,.15) inset, 0 12px 40px rgba(0,0,0,.8);
  padding:18px 18px 14px;
  animation:fsIn .35s ease-out;
}
@keyframes fsIn { from{opacity:0;transform:translateY(14px) scale(.97);} to{opacity:1;transform:none;} }
.fs-tag {
  display:inline-block; font-size:10px; letter-spacing:2px; color:#0d0f08;
  background:var(--gold); border-radius:3px; padding:2px 8px; margin-bottom:10px; font-weight:bold;
}
.fs-title { color:var(--god); font-size:17px; font-weight:bold; margin-bottom:10px; letter-spacing:1px; }
.fs-body { font-size:14px; line-height:1.95; color:#d6d2bd; }

/* ===== 浮动提示（永远在最上层，含标题屏阶段的清档提示） ===== */
#float-layer { position:fixed; inset:0; z-index:420; pointer-events:none; }
.float-toast {
  position:absolute; left:50%; top:18%; transform:translateX(-50%);
  background:rgba(10,14,12,.94); border:1px solid var(--line2); color:var(--txt);
  padding:9px 18px; border-radius:6px; font-size:13px; white-space:nowrap;
  animation:toastIn 1.6s ease-out forwards;
}
.float-toast.good { color:var(--green); border-color:#3a5a3a; }
.float-toast.bad  { color:var(--red); border-color:#6e3a34; }
.float-toast.gold { color:var(--gold); border-color:#5a5028; }
@keyframes toastIn {
  0% { opacity:0; transform:translate(-50%,10px); }
  15% { opacity:1; transform:translate(-50%,0); }
  75% { opacity:1; }
  100% { opacity:0; transform:translate(-50%,-12px); }
}
/* ===== 豆包N6：战斗舞台 ===== */
#ov-battle { z-index:460; background:rgba(1,2,2,.98); padding:0; display:none; flex-direction:column; }
#ov-battle.active { display:flex; }
.bt-head { display:flex; align-items:center; justify-content:space-between; padding:12px 16px 8px; border-bottom:1px solid var(--line); }
.bt-title { color:var(--red); font-weight:700; letter-spacing:2px; font-size:15px; }
.bt-tools { display:flex; gap:10px; align-items:center; }
.bt-speed, .bt-flee { font-size:12px; padding:3px 12px; border:1px solid var(--line2); border-radius:4px; color:var(--cyan); cursor:pointer; }
.bt-flee { color:var(--dim); }
.bt-stage { flex:1; overflow-y:auto; padding:12px 14px; display:flex; flex-direction:column; justify-content:center; gap:10px; }
.bt-en { border:1px solid var(--line); border-radius:8px; background:linear-gradient(180deg,#140b0b,#0d0808); padding:10px 12px; position:relative; }
.bt-en.boss { border-color:#5a2a2a; background:linear-gradient(180deg,#1a0a0a,#100606); box-shadow:0 0 14px rgba(224,96,96,.12) inset; }
.bt-en-row { display:flex; align-items:center; gap:10px; }
.bt-en-ava { width:34px; height:34px; border-radius:6px; background:#241010; color:var(--red); display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:700; flex-shrink:0; }
.bt-en-meta { flex:1; min-width:0; }
.bt-en-name { color:#e0a0a0; font-size:13px; font-weight:600; }
.bt-en-sub { color:var(--dim2); font-size:10px; margin-top:1px; }
.bt-en-bar { height:7px; background:#000; border:1px solid #3a1d1d; border-radius:4px; margin-top:5px; overflow:hidden; position:relative; }
.bt-en-fill { height:100%; background:linear-gradient(90deg,#a83838,#e06060); transition:width .25s; }
.bt-en-hp { position:absolute; right:5px; top:-2px; font-size:9px; color:var(--dim); }
.bt-fx { position:absolute; font-weight:800; font-size:18px; pointer-events:none; animation:btfloat .8s ease-out forwards; text-shadow:0 1px 2px #000; }
@keyframes btfloat { 0%{opacity:0; transform:translateY(6px) scale(.8);} 20%{opacity:1; transform:translateY(-2px) scale(1.1);} 100%{opacity:0; transform:translateY(-26px) scale(1);} }
.bt-hero { padding:8px 14px 4px; border-top:1px solid var(--line); background:var(--panel); }
.bt-hero-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:5px; }
.bt-hero-name { color:var(--gold); font-size:13px; font-weight:600; }
#bt-ally-names { color:var(--cyan); font-size:11px; font-weight:400; margin-left:6px; }
.bt-charge-wrap { width:120px; height:9px; background:#000; border:1px solid var(--line2); border-radius:5px; position:relative; overflow:hidden; }
.bt-charge { height:100%; width:0%; background:linear-gradient(90deg,#9a7a20,#ffd966); transition:width .12s linear; }
#bt-charge-txt { position:absolute; inset:0; text-align:center; font-size:8px; line-height:9px; color:var(--txt); }
.bt-bar { height:13px; background:#000; border:1px solid var(--line); border-radius:4px; margin-top:4px; position:relative; overflow:hidden; }
.bt-bar-fill { height:100%; transition:width .25s; }
.bt-bar.hp .bt-bar-fill { background:linear-gradient(90deg,#3a8f4a,#6fbf6f); }
.bt-bar.sta .bt-bar-fill { background:linear-gradient(90deg,#2a6f8f,#40c0c0); }
.bt-bar span { position:absolute; inset:0; text-align:center; font-size:9px; line-height:13px; color:var(--txt); text-shadow:0 1px 1px #000; }
/* 豆包v167：附魔一击栏（特殊魔法弹），位于道具栏上方；紫金色调以区别普通道具 */
.bt-shots { display:grid; grid-template-columns:repeat(2,1fr); gap:7px; padding:8px 14px 0; background:var(--panel2); border-top:1px solid var(--line); }
.bt-shots:empty { display:none; }
.bt-shot { border:1px solid rgba(180,140,230,.5); border-radius:7px; background:#201830; padding:7px 11px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; }
.bt-shot .bs-n { color:#cdb6f5; font-size:12.5px; font-weight:600; }
.bt-shot .bs-c { color:var(--dim); font-size:10px; white-space:nowrap; margin-left:6px; }
.bt-shot .bs-tag { display:inline-block; font-size:9px; padding:1px 5px; border-radius:3px; background:#2c1f40; color:#c79af0; margin-right:5px; }
.bt-shot-hint { grid-column:1/-1; font-size:11.5px; line-height:1.55; color:#c9a86a; background:#241a10; border:1px solid rgba(200,168,106,.35); border-radius:7px; padding:7px 10px; }
/* 豆包v135/v139：战斗道具栏（投掷 + 战斗内用药），位于技能栏上方；N20 起数据驱动、自适应换行 */
.bt-items { display:grid; grid-template-columns:repeat(2,1fr); gap:7px; padding:8px 14px 0; background:var(--panel2); }
.bt-item { border:1px solid rgba(224,160,120,.42); border-radius:7px; background:#241a16; padding:7px 11px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; }
.bt-item.bi-heal { border-color:rgba(120,200,150,.4); background:#16241c; }
.bt-item .bi-n { color:#e8b890; font-size:12.5px; font-weight:600; }
.bt-item.bi-heal .bi-n { color:#8fd6a8; }
.bt-item .bi-c { color:var(--dim); font-size:10px; }
.bt-item:disabled { opacity:.38; cursor:not-allowed; }
.bt-skills { display:grid; grid-template-columns:1fr 1fr; gap:7px; padding:9px 14px; border-top:1px solid var(--line); background:var(--panel2); }
.bt-skill { border:1px solid var(--line2); border-radius:7px; background:var(--panel3); padding:8px 10px; cursor:pointer; position:relative; overflow:hidden; text-align:left; }
.bt-skill .sk-n { color:var(--gold); font-size:12.5px; font-weight:600; }
.bt-skill .sk-c { color:var(--dim); font-size:10px; margin-top:2px; }
.bt-skill .sk-type { float:right; font-size:9px; padding:1px 5px; border-radius:3px; }
.bt-skill:disabled { opacity:.42; cursor:not-allowed; }
.bt-skill .sk-cd { position:absolute; inset:0; background:rgba(0,0,0,.72); display:flex; align-items:center; justify-content:center; color:var(--cyan); font-size:13px; font-weight:700; }
.t-firearm { color:#8fd0e0; } .sk-type.t-firearm { background:#12242a; color:#8fd0e0; }
.t-magic { color:#c79af0; } .sk-type.t-magic { background:#241730; }
.t-martial { color:#e0c07a; } .sk-type.t-martial { background:#2c2410; }
.t-aux { color:#9fd0a0; } .sk-type.t-aux { background:#16291a; }
.t-mecha { color:#d0a080; } .sk-type.t-mecha { background:#2a1c14; }
.bt-log { max-height:74px; overflow-y:auto; padding:7px 14px 10px; border-top:1px solid var(--line); font-size:11px; color:var(--dim); line-height:1.65; background:#070a09; }
.bt-log .l-hit { color:#e0a0a0; } .bt-log .l-crit { color:var(--gold); } .bt-log .l-info { color:var(--cyan); } .bt-log .l-good { color:var(--green); }
.enc-btn { margin:3px 0 2px 2px; width:calc(100% - 4px); border:1px solid #6a2a2a; border-radius:7px; background:linear-gradient(180deg,#1c0d0d,#120909); color:#e8a0a0; padding:9px 12px; font-size:13px; cursor:pointer; text-align:left; animation:encpulse 1.6s ease-in-out infinite; }
@keyframes encpulse { 0%,100%{ box-shadow:0 0 0 rgba(224,96,96,0);} 50%{ box-shadow:0 0 12px rgba(224,96,96,.28);} }
.enc-btn .enc-sub { display:block; font-size:10px; color:var(--dim); margin-top:2px; }
/* ===== 豆包N13：主神光球入口 + 兑换面板 ===== */
.orb-btn { margin:3px 0 2px 2px; width:calc(100% - 4px); border:1px solid #8a7230; border-radius:8px;
  background:radial-gradient(120% 140% at 50% 0%, #241d08, #120f06 70%); color:var(--god);
  padding:12px 14px; font-size:14px; font-weight:600; cursor:pointer; text-align:center; letter-spacing:1px;
  animation:orbpulse 2.2s ease-in-out infinite; }
.orb-btn .orb-sub { display:block; font-size:10px; font-weight:400; color:var(--dim); margin-top:3px; letter-spacing:0; }
@keyframes orbpulse { 0%,100%{ box-shadow:0 0 0 rgba(255,217,102,0);} 50%{ box-shadow:0 0 16px rgba(255,217,102,.30);} }
/* 资产条 */
.shop-wallet { display:flex; gap:8px; margin-bottom:12px; }
.shop-wallet .sw-item { flex:1; border:1px solid var(--line2); border-radius:8px; background:var(--panel2); padding:9px 10px; text-align:center; }
.shop-wallet .sw-l { font-size:10px; color:var(--dim); letter-spacing:1px; }
.shop-wallet .sw-v { font-size:18px; font-weight:700; color:var(--god); margin-top:2px; }
.shop-wallet .sw-v.br { font-size:13px; color:var(--cyan); line-height:1.9; }
.shop-repair { width:100%; margin-bottom:14px; padding:10px; border:1px solid #3a5a44; border-radius:8px;
  background:linear-gradient(180deg,#102018,#0b150f); color:#9fe0b0; font-size:13px; cursor:pointer; }
/* 商品卡片 */
.shop-card { display:flex; gap:11px; align-items:center; border:1px solid var(--line); border-radius:9px;
  background:var(--panel2); padding:11px 12px; margin-bottom:9px; }
.shop-card.owned { border-color:#4a5a3a; background:#0e150d; }
.shop-card.locked { opacity:.62; background:#0c0f0e; }
.shop-card .sc-ico { width:38px; height:38px; flex-shrink:0; border-radius:8px; display:flex; align-items:center; justify-content:center;
  font-size:18px; background:#1a2420; border:1px solid var(--line2); }
.shop-card .sc-main { flex:1; min-width:0; }
.shop-card .sc-n { font-size:14px; color:var(--txt); font-weight:600; }
.shop-card .sc-n .sc-tag { font-size:10px; padding:1px 5px; border-radius:3px; margin-left:6px; vertical-align:1px; font-weight:400; }
.sc-tag.t-firearm{ background:#1d2c2c; color:var(--cyan);} .sc-tag.t-aux{ background:#23241a; color:#c8c070;}
.sc-tag.t-magic{ background:#241a2c; color:#c08ae0;} .sc-tag.t-martial{ background:#1c2418; color:#9cc97a;}
.sc-tag.t-mecha{ background:#26201a; color:#e0a878;} .sc-tag.t-base{ background:#222a26; color:var(--dim);}
.sc-tag.t-fun{ background:#241f24; color:#b08aa0;}
.shop-card .sc-d { font-size:11px; color:var(--dim); line-height:1.55; margin-top:3px; }
.shop-card .sc-buy { flex-shrink:0; min-width:74px; }
.shop-card .sc-price { font-size:15px; font-weight:700; color:var(--god); white-space:nowrap; }
.shop-card .sc-price small { font-size:10px; color:var(--dim); font-weight:400; }
.sc-btn { width:100%; margin-top:5px; padding:7px 0; border-radius:6px; border:1px solid var(--gold);
  background:var(--gold); color:#141106; font-weight:700; font-size:12px; cursor:pointer; }
.sc-btn:disabled { background:transparent; color:var(--dim2); border-color:var(--line); cursor:not-allowed; }
.sc-btn.ghost { background:transparent; color:var(--green); border-color:#3a5a44; }
.sc-owned { text-align:center; color:var(--green); font-size:12px; font-weight:600; }
.sc-lockneed { text-align:center; color:var(--dim2); font-size:10px; line-height:1.5; }
/* 属性强化行 */
.attr-row { display:flex; align-items:center; gap:10px; border:1px solid var(--line); border-radius:9px;
  background:var(--panel2); padding:10px 12px; margin-bottom:8px; }
.attr-row .ar-n { width:78px; flex-shrink:0; font-size:13px; color:var(--txt); }
.attr-row .ar-n small { display:block; font-size:9px; color:var(--dim2); }
.attr-row .ar-v { width:52px; text-align:center; font-size:17px; font-weight:700; color:var(--cyan); flex-shrink:0; }
.attr-row .ar-bs { margin-left:auto; display:flex; gap:6px; flex-shrink:0; }
.attr-row .ar-bs button { padding:7px 11px; border-radius:6px; border:1px solid var(--gold); background:transparent;
  color:var(--gold); font-size:12px; font-weight:600; cursor:pointer; }
.attr-row .ar-bs button:disabled { color:var(--dim2); border-color:var(--line); cursor:not-allowed; }
.shop-note { font-size:10px; color:var(--dim2); line-height:1.6; margin:4px 2px 14px; }
.shop-sect-t { font-size:12px; color:var(--god); letter-spacing:1px; margin:14px 2px 8px; border-left:2px solid var(--gold); padding-left:8px; }
/* ===== 豆包N7：队友角标 / 队伍面板 ===== */
.person.is-ally { outline:1px solid rgba(232,200,96,.55); box-shadow:0 0 10px rgba(232,200,96,.12) inset; }
.ally-tag { font-size:10px; color:#1a1405; background:var(--gold); border-radius:3px; padding:0 5px; margin-left:3px; vertical-align:1px; }
/* 豆包v123：NPC 苦战中（被怪物拖住、待营救）*/
.person.is-struggle { border-left-color:#c0564f; outline:1px solid rgba(192,86,79,.6); box-shadow:0 0 12px rgba(192,86,79,.18) inset; animation:strugglepulse 1.1s ease-in-out infinite; }
.person.is-struggle .p-ava { background:#a8443d; }
.struggle-tag { font-size:10px; color:#fff; background:#c0564f; border-radius:3px; padding:0 5px; margin-left:4px; vertical-align:1px; }
@keyframes strugglepulse { 0%,100%{ box-shadow:0 0 8px rgba(192,86,79,.12) inset; } 50%{ box-shadow:0 0 16px rgba(192,86,79,.4) inset; } }
.ally-line { display:flex; align-items:center; gap:8px; padding:7px 10px; border:1px solid var(--line2); border-radius:7px; background:var(--panel3); margin-bottom:7px; }
.ally-line .al-ava { width:32px;height:32px;border-radius:6px;background:#2a2410;color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0; }
.ally-line .al-n { color:var(--gold);font-size:13px;font-weight:600; }
.ally-line .al-r { color:var(--dim);font-size:10px;margin-top:1px; }
.ally-line .al-stats { margin-left:auto;text-align:right;font-size:10px;color:var(--dim2);line-height:1.5; }
/* ===== 豆包N9：剧情对话流（视觉小说式气泡累积，自动滚底） ===== */
#dialog-body { padding:14px 16px 6px; }
.dlg-flow { display:flex; flex-direction:column; gap:11px; }
.dlg-bub { border-left:3px solid var(--line2); padding:2px 0 2px 11px; animation:dlgin .22s ease-out; }
@keyframes dlgin { from{opacity:0; transform:translateY(7px);} to{opacity:1; transform:none;} }
.dlg-who { font-size:12px; font-weight:700; margin-bottom:3px; letter-spacing:1px; }
.dlg-say { font-size:14px; color:var(--txt); line-height:1.75; }
.dlg-narr { border-left-color:var(--cyan); }
.dlg-narr .dlg-say { color:var(--dim); font-size:13px; }
.dlg-god { border-left-color:var(--gold); background:linear-gradient(90deg,rgba(232,200,96,.08),transparent); padding:7px 10px; border-radius:0 6px 6px 0; }
.dlg-god .dlg-say { color:var(--god); letter-spacing:1px; }
.dlg-mine { border-left-color:#6fbf6f; }
.dlg-mine .dlg-who { color:#6fbf6f; }
.dlg-choice { display:flex; flex-direction:column; gap:8px; margin-top:4px; }
.dlg-choice .here-btn { text-align:left; line-height:1.5; }

/* ===== 豆包v129/v130：场景可搜刮物件 WK.OBJ（紧凑成排，尺寸对齐地图格，只写泛称不剧透） ===== */
.obj-sec { margin-top:12px; }
.obj-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(62px,1fr)); gap:6px; }
.obj-card {
  min-height:52px; padding:6px 4px; border-radius:7px; text-align:center; cursor:pointer;
  background:var(--panel2); border:1px solid var(--line2);
  display:flex; align-items:center; justify-content:center; transition:border-color .12s;
}
.obj-card:active { border-color:var(--gold); }
.obj-card .o-name { font-size:12.5px; color:var(--txt); line-height:1.25; }
.obj-card.is-ready { border-color:#5a5238; }
.obj-card.is-frozen { border-color:#3a5a66; }
.obj-card.is-frozen .o-name { color:#9cc6d2; }
.obj-card.is-danger { border-color:#7a4038; }
.obj-card.is-danger .o-name { color:#e0a0a0; }
.obj-card.is-done { opacity:.38; cursor:default; }
.obj-card.is-done .o-name { color:var(--dim2); }
.obj-card.is-remain { border-color:#7a6536; box-shadow:0 0 0 1px rgba(232,200,96,.25) inset; }
/* 容量条 */
.cap-bar { height:7px; border-radius:4px; background:var(--panel3); border:1px solid var(--line); overflow:hidden; margin:6px 0 2px; }
.cap-bar > i { display:block; height:100%; background:var(--gold); }
.cap-bar.over > i { background:var(--red); }

  /* —— 血统兑换：主神光柱加载 —— */
  #ov-blood-ritual{position:fixed;inset:0;z-index:9999;background:rgba(2,6,12,.88);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;color:#e8f0e8;}
  #ov-blood-ritual.active{display:flex;}
  #ov-blood-ritual .br-pillar{width:min(280px,70vw);height:min(360px,50vh);background:linear-gradient(180deg,rgba(255,220,120,.15),rgba(120,180,255,.25),rgba(80,200,160,.2));border-radius:12px;box-shadow:0 0 40px rgba(255,200,80,.35),inset 0 0 30px rgba(255,255,255,.08);position:relative;overflow:hidden;margin-bottom:20px;}
  #ov-blood-ritual .br-pillar::after{content:"";position:absolute;inset:-20%;background:repeating-linear-gradient(0deg,transparent,transparent 8px,rgba(255,255,255,.04) 8px,rgba(255,255,255,.04) 10px);animation:br-fall 1.2s linear infinite;}
  @keyframes br-fall{from{transform:translateY(-20%)}to{transform:translateY(20%)}}
  #ov-blood-ritual .br-title{font-size:16px;color:var(--gold,#e8c070);margin-bottom:8px;letter-spacing:.08em;}
  #ov-blood-ritual .br-narr{max-width:420px;font-size:13.5px;line-height:1.85;color:#c8d6c8;text-align:center;margin-bottom:18px;min-height:4.5em;}
  #ov-blood-ritual .br-bar{width:min(320px,80vw);height:10px;background:#1a2430;border-radius:6px;overflow:hidden;border:1px solid #3a4a5a;}
  #ov-blood-ritual .br-bar>i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#c9a227,#f0d78c,#7ec8a0);transition:width .15s linear;}
  #ov-blood-ritual .br-pct{margin-top:8px;font-size:12px;color:#8a9a8a;}


  #shop-tabs.ov-tabs { overflow-x:auto; -webkit-overflow-scrolling:touch; flex-wrap:nowrap; }
  #shop-tabs .ov-tab { flex:0 0 auto; min-width:4.5em; padding:10px 12px; font-size:13px; white-space:nowrap; }
  #bt-allies { max-height:28vh; overflow-y:auto; flex-shrink:0; }
  #ov-battle .bt-stage { flex:1 1 auto; min-height:22vh; max-height:42vh; overflow-y:auto; }
  #ov-battle .bt-hero, #ov-battle .bt-skills, #ov-battle .bt-items, #ov-battle .bt-log { flex-shrink:0; }
</style>
</head>
<body>

<!-- ================= 标题屏（N1：新游戏/继续/清档） ================= -->
<div id="intro">
  <svg class="bio-svg" width="86" height="86" viewBox="0 0 100 100" fill="none" stroke="#e8c860" stroke-width="2.2">
    <circle cx="50" cy="50" r="9" fill="#e8c860" stroke="none"/>
    <circle cx="50" cy="25" r="11.5"/>
    <circle cx="28.5" cy="62.5" r="11.5"/>
    <circle cx="71.5" cy="62.5" r="11.5"/>
    <circle cx="50" cy="50" r="42" stroke-dasharray="2 6" opacity=".55"/>
  </svg>
  <div class="en-title">INFINITE TERROR</div>
  <div class="cn-title">无限恐怖</div>
  <div class="cn-sub">第一集 · 名为生化</div>
  <div class="cn-desc">想明白生命的意义吗？<br>想真正的……活着吗？</div>
  <div class="intro-btns">
    <button class="here-btn primary" id="btn-new" onclick="WK.ui.clickNewGame()">开始新游戏</button>
    <button class="here-btn" id="btn-continue" style="display:none;" onclick="WK.ui.clickContinue()">继续游戏</button>
    <button class="here-btn ghost" id="btn-clear" style="display:none;" onclick="WK.ui.clickClearSave()">清除存档</button>
  </div>
  <div class="ver-line" id="ver-line"></div>
</div>

<!-- ================= 主游戏界面（N1：面板与日志均可用，地图区为占位） ================= -->
<div id="game">
  <div id="topnav">
    <div class="tn-side" onclick="WK.ui.openStatus('attr')">人物</div>
    <div class="tn-center">
      <div id="nav-loc">——</div>
      <div id="nav-watch">手表 --:--</div>
    </div>
    <div class="tn-side right" onclick="WK.ui.openWatch()">主神手表</div>
  </div>

  <div id="main-area">
    <div class="scene-desc" id="scene-desc"></div>
    <!-- N3 起：九宫格行走渲染到 #map-container；可交互对象渲染到 #here-section -->
    <div id="map-container"></div>
    <!-- 豆包v128：场景互动点（搜查 / 开箱 / 精英怪 / 关键道具）。配置驱动，见 WK.SPOTS。
         排在九宫格正下方、等待横幅与人物列表之上——让空地图「有东西可点」，且第一眼就能看到。 -->
    <div id="spot-banner"></div>
    <!-- 豆包v129：本房可搜刮物件（箱/柜/尸体/终端，逐个卡片，数据见 WK.OBJ） -->
    <div id="obj-container"></div>
    <!-- 豆包v127：置顶「整队 / 原地等待」横幅——这类需要玩家注意、又不能离开当前地块的操作，
         统一放在人物列表上方，避免被一长排人物卡片挤到下面、注意不到。 -->
    <div id="wait-banner"></div>
    <!-- 豆包N4：本房间在场人物（点击占位交互；N8 起他们会随剧情移动） -->
    <div id="people-container"></div>
    <!-- 豆包N6：本房间遭遇入口（漫游测试用；正式由剧情触发，N14 收口） -->
    <div id="encounter-container"></div>
    <div id="here-section"></div>
  </div>

  <!-- 唯一日志的挂载位 -->
  <div id="log-slot"><div id="log-area"></div></div>

  <div id="actionbar">
    <button class="abtn" onclick="WK.ui.openStatus('bag')">背包</button>
    <button class="abtn" onclick="WK.ui.openStatus('skill')">技能</button>
    <button class="abtn" onclick="WK.ui.openTasks()">任务</button>
    <button class="abtn" onclick="WK.ui.openSystem()">系统</button>
  </div>
</div>

<!-- ================= 人物面板（属性 / 背包 / 技能 三 Tab） ================= -->
<div class="overlay" id="ov-status">
  <div class="overlay-header">
    <div class="oh-side" onclick="WK.ui.closeOverlay('ov-status')">返回</div>
    <div class="oh-center">人物</div>
    <div style="width:42px;"></div>
  </div>
  <div class="ov-tabs">
    <button class="ov-tab active" id="stab-attr"  onclick="WK.ui.switchStatusTab('attr')">属性</button>
    <button class="ov-tab"        id="stab-equip" onclick="WK.ui.switchStatusTab('equip')">装备</button>
    <button class="ov-tab"        id="stab-bag"   onclick="WK.ui.switchStatusTab('bag')">背包</button>
    <button class="ov-tab"        id="stab-skill" onclick="WK.ui.switchStatusTab('skill')">技能</button>
    <button class="ov-tab" id="stab-blood" onclick="WK.ui.switchStatusTab('blood')">血统</button>
  </div>
  <div class="overlay-body" id="status-body"></div>
</div>

<!-- ================= 主神手表（N2 接入倒计时与规则数据，N1 静态占位） ================= -->
<div class="overlay" id="ov-watch">
  <div class="overlay-header">
    <div class="oh-side" onclick="WK.ui.closeOverlay('ov-watch')">返回</div>
    <div class="oh-center">主神手表</div>
    <div style="width:42px;"></div>
  </div>
  <div class="overlay-body" id="watch-body"></div>
</div>

<!-- ================= 通用小窗（任务列表 / 系统菜单 / 以后的商店等） ================= -->
<div class="overlay compact" id="ov-generic">
  <div class="overlay-header">
    <div style="width:42px;"></div>
    <div class="oh-center" id="generic-title">提示</div>
    <div class="oh-side" onclick="WK.ui.closeOverlay('ov-generic')">关闭</div>
  </div>
  <div class="overlay-body" id="generic-body"></div>
</div>

<!-- ================= 豆包N3：全屏区域小地图 ================= -->
<div class="overlay" id="ov-map">
  <div class="overlay-header">
    <div class="oh-side" onclick="WK.ui.closeOverlay('ov-map')">返回</div>
    <div class="oh-center">蜂房小地图</div>
    <div style="width:42px;"></div>
  </div>
  <div class="overlay-body" id="map-body"></div>
</div>

<!-- ================= 豆包N13：主神空间 · 兑换（属性 / 科技 / 辅助 / 魔法 / 武功 / 机甲 / 娱乐） ================= -->
<div class="overlay" id="ov-shop">
  <div class="overlay-header">
    <div class="oh-side" onclick="WK.ui.closeOverlay('ov-shop')">离开光球</div>
    <div class="oh-center">主神 · 兑换</div>
    <div style="width:56px;"></div>
  </div>
  <div class="ov-tabs" id="shop-tabs"><!-- Tab 由 WK.SHOP 渲染 --></div>
  <div class="overlay-body" id="shop-body"></div>
</div>

<!-- ================= 剧情 / NPC 对话窗（支持说话人着色与多选项分支） ================= -->
<!-- z-index 必须高于标题屏 intro(300)：新游戏起名、覆盖存档确认都在标题屏阶段弹出 -->
<div class="overlay" id="ov-dialog">
  <div class="overlay-header">
    <div style="width:42px;"></div>
    <div class="oh-center" id="dialog-name">对话</div>
    <div style="width:42px;"></div>
  </div>
  <div class="overlay-body"><div class="dlg-text" id="dialog-body"></div></div>
  <div class="dlg-actions" id="dialog-actions"></div>
</div>

<!-- ================= 豆包N2：记忆闪回（预知剧情，可接先知支线） ================= -->
<div class="overlay" id="ov-foreshow">
  <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:26px 20px;">
    <div class="fs-card">
      <div class="fs-tag">记忆闪回 · FORESHADOW</div>
      <div class="fs-title" id="fs-title"></div>
      <div class="fs-body dlg-text" id="fs-body"></div>
      <div class="dlg-actions" id="fs-actions" style="position:static;border:none;background:transparent;padding:6px 0 0;"></div>
    </div>
  </div>
</div>

<!-- ================= 豆包N6：战斗舞台（ATB 集气实时制；五类型技能；预留特殊战斗/主动索敌） ================= -->
<div class="overlay" id="ov-battle">
  <div class="bt-head">
    <div class="bt-title" id="bt-title">遭遇战</div>
    <div class="bt-tools">
      <span class="bt-speed" id="bt-speed" onclick="WK.battle.toggleSpeed()">1×</span>
      <span class="bt-flee" id="bt-flee" onclick="WK.battle.tryFlee()">撤离</span>
    </div>
  </div>
  <div class="bt-stage" id="bt-stage">
    <!-- 敌人卡组由 JS 渲染 -->
  </div>
  <div id="bt-allies" style="padding:6px 14px 0;background:var(--panel);border-top:1px solid var(--line);display:none;"></div>
  <div class="bt-hero" id="bt-hero">
    <div class="bt-hero-top">
      <div class="bt-hero-name">我</div>
      <div class="bt-charge-wrap"><div class="bt-charge" id="bt-charge"></div><span id="bt-charge-txt">集气</span></div>
    </div>
    <div class="bt-bar hp"><div class="bt-bar-fill" id="bt-hp-fill"></div><span id="bt-hp-txt"></span></div>
    <!-- 豆包v177：耐久护盾条（护符/冰晶护盾；无护盾时隐藏） -->
    <div class="bt-bar" id="bt-shield-wrap" style="display:none;margin-top:3px;"><div class="bt-bar-fill" id="bt-shield-fill" style="background:linear-gradient(90deg,#5fa8d8,#bfe6f5);"></div><span id="bt-shield-txt" style="color:#dff0fa;"></span></div>
    <div class="bt-bar sta"><div class="bt-bar-fill" id="bt-sta-fill"></div><span id="bt-sta-txt"></span></div>
    <!-- 豆包v173：特殊能量条（内力/法力/血族能量等，由血统或气功等修炼开启；无则隐藏） -->
    <div id="bt-pools" style="display:none;flex-direction:column;gap:3px;margin-top:3px;"></div>
  </div>
  <div class="bt-shots" id="bt-shots"><!-- 豆包v167：附魔一击（装备枪/弓后的特殊魔法弹，主动点按、一发一耗） --></div>
  <div class="bt-items" id="bt-items"><!-- 豆包v135：战斗道具栏（手雷等战术投掷物 / 护身符对策卡）；N20 将扩成完整战斗道具栏 --></div>
  <div class="bt-skills" id="bt-skills"><!-- 技能按钮由 SKILL_DEF 渲染 --></div>
  <div class="bt-log" id="bt-log"></div>
</div>

<!-- 浮动提示层 -->
<div id="float-layer"></div>

<script src="01-data.js"></script>
<script src="02-bio1.js"></script>

<script src="04-ui.js"></script>
<script src="05-main.js"></script>
